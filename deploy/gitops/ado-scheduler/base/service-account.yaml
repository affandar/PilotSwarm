apiVersion: v1
kind: ServiceAccount
metadata:
  name: pilotswarm-ado-scheduler
  labels:
    app.kubernetes.io/name: pilotswarm
    app.kubernetes.io/component: ado-scheduler
  annotations:
    # Federated with the BaseInfra-provisioned UAMI. The value is
    # overlay-filled from WORKLOAD_IDENTITY_CLIENT_ID. The scheduler's
    # projected token authenticates its runtime Azure SDK calls:
    #   - Postgres AAD token   (session_tree_affinity + CMS observe)
    #   - Azure DevOps token   (queue pipeline runs)
    # so no long-lived secrets are mounted for those paths.
    azure.workload.identity/client-id: __WORKLOAD_IDENTITY_CLIENT_ID__
