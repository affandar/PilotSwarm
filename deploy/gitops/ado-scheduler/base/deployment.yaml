apiVersion: apps/v1
kind: Deployment
metadata:
  name: pilotswarm-ado-scheduler
  labels:
    app.kubernetes.io/name: pilotswarm
    app.kubernetes.io/component: ado-scheduler
spec:
  # SINGLETON. The scheduler is the ADO placement provider — it observes
  # runnable session trees and queues one ADO pipeline run per tree. Two
  # concurrent schedulers would race and double-queue runs (the affinity
  # row dedups within a single reconcile pass, not across two processes
  # observing the same pre-queue state). Keep exactly one live process:
  #   - replicas: 1
  #   - strategy: Recreate — the old pod is torn down BEFORE the new one
  #     starts during a rollout, so there is never a moment with two
  #     schedulers. (A rolling update would briefly run 2.)
  # HA follow-up (deferred): add coordination.k8s.io Lease-based leader
  # election so a warm standby can take over faster than a pod reschedule.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: pilotswarm
      app.kubernetes.io/component: ado-scheduler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pilotswarm
        app.kubernetes.io/component: ado-scheduler
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: pilotswarm-ado-scheduler
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      # imagePullSecrets intentionally omitted: AKS kubelet managed identity
      # with AcrPull role (provisioned in BaseInfra) authenticates ACR pulls.
      containers:
        - name: ado-scheduler
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          envFrom:
            # Non-secret scheduler config (store coordinates, ADO target,
            # reconcile tuning). Built from the overlay .env.
            - configMapRef:
                name: ado-scheduler-env
            # LLM_API_KEY that the scheduler injects into the worker pipeline
            # run's secret variables. Optional so the Deployment applies before
            # the secret exists; the scheduler fails fast at queue time if the
            # key is required and absent. PREFERRED (TODO): drop this secret and
            # fetch the key at runtime via the pod's workload identity, matching
            # how PG + ADO tokens are already minted.
            - secretRef:
                name: ado-scheduler-secrets
                optional: true
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"
      restartPolicy: Always
