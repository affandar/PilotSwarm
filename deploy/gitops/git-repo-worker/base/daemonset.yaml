# -----------------------------------------------------------------------------
# PilotSwarm git-repo-worker — a headless worker collocated 1:1 with the
# git-cache mirror DaemonSet on a per-repo node pool.
# AKS git-hydration lifecycle (AKS-GIT-HYDRATION.md sections 5 & 6):
#   - Co-scheduled with the mirror daemon from node boot (tolerates the pool's
#     cache-not-ready taint, selects the pool by git-cache-repo label).
#   - An initContainer (wait-for-mirror) blocks the worker process from starting
#     until the daemon has written this node's readiness sentinel, so a worker
#     never polls PostgreSQL for a job on a still-warming node.
#   - Once live, the worker keeps ONE reused working enlistment (a node-local
#     hostPath, __CACHE_HOSTPATH__-enlistment, on the same disk as the mirror),
#     cloned once from the node-local bare mirror. BEFORE every job it fetches
#     from the mirror and hard-resets to the target ref. With
#     PILOTSWARM_WORKER_CONCURRENCY=1 the single job slot is the mutex: the
#     reconcile runs on an idle tree (worker briefly "unavailable"), and once a
#     job runs the daemon's hourly `git fetch` (gc off -> append-only) can never
#     race it. Because the enlistment is a hostPath it survives pod restarts and
#     node reboots, so a restarted worker skips the one-time clone and just
#     reconciles (seconds); a torn tree is self-healed by re-clone.
#
# THIS FILE IS URL-FREE. __REPO_NAME__ is a DNS-safe short name substituted by
# the deployment scripts that live OUTSIDE this GitHub repo (in the private
# ops repo, under a git-hydration/ folder). The ADO repo URLs never appear here.
#
# Tokens (substituted by the deploy scripts from a per-repo .env):
#   __REPO_NAME__       DNS-safe short name; must match the git-cache pool label
#   __IMAGE__           worker container image (ACR ref), same image as the Deployment
#   __WORKER_MAX_UNAVAILABLE__  rolling-update concurrency for the worker fleet.
#                       Unlike git-cache this NEVER touches ADO — a roll is a
#                       node-local fetch+reset of the persistent enlistment
#                       hostPath from the node-local mirror (seconds on a warm
#                       node). So the only cost is a temporary dip in job-serving
#                       slots; jobs queue in PG and drain. Default 50% (rounds
#                       down, min 1) keeps a serving majority while rolling fast.
#   __CACHE_HOSTPATH__  node-local dir the git-cache DaemonSet seeds; MUST match
#                       the git-cache CACHE_HOSTPATH for this repo (defaults to
#                       the OS disk /var/lib; a pool may override to /mnt). The
#                       worker's reused enlistment is a sibling on the SAME disk,
#                       "__CACHE_HOSTPATH__-enlistment" (survives pod restarts /
#                       node reboots), so this disk must fit mirror + enlistment.
#   __PLUGIN_SPEC__     optional ;-delimited external plugin repos the worker
#                       downloads at startup and adds to its plugin dirs; the
#                       concrete value (which names an ADO org/project/repo) is
#                       kept in the per-repo .env, never here. Empty = none.
#   __ADO_PAT_KV_SECRET_URI__  optional Key Vault secret URI for the ADO Code:Read
#                       PAT used by PluginSpec ADO clones; the worker reads it via
#                       its managed identity (no PAT in a Secret). Empty = none.
#   __REPO_MCP_ALLOW__  optional comma-delimited allowlist of MCP server ids (from
#                       the repo's own .vscode/mcp.json) to load + grant to every
#                       session on this repo-pinned fleet. Empty = all remote servers.
#   __DEFAULT_MCP_JSON__  optional inline JSONC { "servers": { ... } } map of REMOTE
#                       fleet-default MCP servers (e.g. the ADO MCP) injected into
#                       every session regardless of the repo's .vscode/mcp.json; each
#                       is optional (skipped, not fast-failed, when the caller lacks a
#                       token for its audience). URL-free rule: the concrete ADO
#                       URL/org live in the per-repo .env, never here. Empty = none.
#   __CALLER_AUTH_KEYVAULT_NAME__  optional Key Vault name where the portal stores a
#                       caller's delegated bearer (ps-caller-<sessionId>); the worker
#                       reads it and injects it into repo-declared remote MCP servers
#                       "as the caller". Empty = delegated caller auth off.
# -----------------------------------------------------------------------------
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: git-repo-worker-__REPO_NAME__
  namespace: pilotswarm
  labels:
    app.kubernetes.io/name: pilotswarm
    app.kubernetes.io/component: git-repo-worker
    pilotswarm.io/git-cache-repo: __REPO_NAME__
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: pilotswarm
      app.kubernetes.io/component: git-repo-worker
      pilotswarm.io/git-cache-repo: __REPO_NAME__
  # maxUnavailable bounds how many worker pods roll at once. The worker never
  # touches ADO: a roll is a node-local fetch+reset of the persistent enlistment
  # hostPath from the node-local mirror (seconds on a warm node), so the only
  # cost is a temporary reduction in job-serving slots — jobs queue in PG and
  # drain. Default 50% (rounds down, min 1) keeps a serving majority while
  # rolling aggressively. Token substituted from WORKER_MAX_UNAVAILABLE.
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: __WORKER_MAX_UNAVAILABLE__
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pilotswarm
        app.kubernetes.io/component: git-repo-worker
        pilotswarm.io/git-cache-repo: __REPO_NAME__
        azure.workload.identity/use: "true"
    spec:
      # Dedicated workload-identity SA for the git-repo-worker fleet, federated to
      # the managed identity that holds PG + blob + ACR access. Provisioned by the
      # deploy scripts (git-hydration/ensure-worker-identity.ps1), NOT borrowed
      # from the legacy pilotswarm-ado-scheduler SA. Secrets come via envFrom
      # below (this PoC cluster has no secrets-store CSI driver).
      serviceAccountName: copilot-runtime-worker
      # Land on this repo's git-cache pool, next to the mirror daemon.
      nodeSelector:
        pilotswarm.io/git-cache-repo: __REPO_NAME__
      tolerations:
        # The pool is dedicated + pre-tainted; cache-aware pods tolerate it so
        # they co-schedule with the mirror from boot (readiness is gated below
        # by the initContainer, NOT by taint removal — see the design note).
        - key: pilotswarm.io/cache-not-ready
          operator: Equal
          value: "true"
          effect: NoSchedule
        - key: kubernetes.azure.com/scalesetpriority
          operator: Equal
          value: spot
          effect: NoSchedule
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
      initContainers:
        # 1) Job-acceptance gate. Block until the git-cache daemon on THIS node
        #    has completed the initial mirror and written the sentinel. Because
        #    the worker polls PG for jobs, not-started == cannot-accept-a-job, so
        #    this is a race-free readiness gate for a still-warming node.
        - name: wait-for-mirror
          image: busybox:1.36
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          command:
            - sh
            - -c
            - |
              set -eu
              SENT="/mnt/git-cache/__REPO_NAME__.ready"
              echo "[wait-for-mirror] waiting for $SENT (git-cache initial clone) ..."
              t=0
              until [ -f "$SENT" ]; do
                sleep 2; t=$((t+2))
                if [ $((t % 30)) -eq 0 ]; then echo "[wait-for-mirror] still waiting after ${t}s ..."; fi
              done
              echo "[wait-for-mirror] mirror ready after ${t}s -> starting worker"
          volumeMounts:
            - name: git-cache
              mountPath: /mnt/git-cache
              readOnly: true
        # 2) Prepare the copilot home scratch dir (same as the Deployment path).
        - name: init-copilot-home
          image: busybox:1.36
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          command:
            - sh
            - -lc
            - |
              set -eu
              mkdir -p /home/node/.copilot/session-state && chown -R 1000:1000 /home/node/.copilot
              # Non-recursive: the enlistment is now a persistent hostPath that may
              # already hold a full ~repo-size working tree (all files created by the
              # worker as uid 1000). Only the mount root needs its owner fixed so the
              # worker can create/replace the enlistment; a chown -R would needlessly
              # walk the whole tree on every pod restart.
              mkdir -p /mnt/enlistment && chown 1000:1000 /mnt/enlistment
          volumeMounts:
            - name: copilot-home
              mountPath: /home/node/.copilot
            - name: enlistment
              mountPath: /mnt/enlistment
      containers:
        - name: git-repo-worker
          image: __IMAGE__
          imagePullPolicy: IfNotPresent
          command: ["node", "packages/sdk/examples/git-repo-worker.js"]
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: RUST_LOG
              value: "info"
            - name: PS_MODEL_PROVIDERS_PATH
              value: "/app/config/model_providers.json"
            # One PilotSwarm job per pod at a time. This single job slot is the
            # mutex that makes reconcile-before-job race-free: while the worker
            # reconciles its enlistment it claims no other job (see git-repo-worker.js).
            - name: PILOTSWARM_WORKER_CONCURRENCY
              value: "1"
            # Repo-affinity routing: tag this fleet with ITS OWN repo so a
            # repo:<name>-tagged runTurn is served only by the fleet hydrated for
            # that repo. This MUST be set per-DaemonSet — the shared worker-env
            # ConfigMap carries a single repo tag, so without this explicit
            # override (an env entry wins over envFrom for the same key) every
            # fleet would advertise the same repo and jobs would cross fleets /
            # non-matching repos would hang. Pairs with PILOTSWARM_WORKER_TAG_MODE
            # (default defaultAnd: untagged support activities + this repo's runTurn).
            - name: PILOTSWARM_WORKER_TAGS
              value: "repo:__REPO_NAME__"
            # git-cache collocation: the node-local bare mirror this worker clones
            # its enlistment from and fetches from before each job. Read-only mount
            # below; only the git-cache daemon writes it.
            - name: GIT_CACHE_ROOT
              value: "/mnt/git-cache"
            - name: GIT_CACHE_REPO
              value: "__REPO_NAME__"
            - name: GIT_CACHE_MIRROR
              value: "/mnt/git-cache/__REPO_NAME__.git"
            # Reused working enlistment (writable node-local hostPath — see the
            # enlistment volume below). Cloned once from the mirror, then fetch +
            # hard-reset before each job. GIT_ENLISTMENT_REF is unset -> reconcile
            # targets the mirror's default branch.
            - name: GIT_ENLISTMENT_ROOT
              value: "/mnt/enlistment"
            # Readiness sentinel path — MUST match the readinessProbe below. The
            # worker writes it only after worker.start() (enlistment synced +
            # polling) and removes it on drain; it lives on the pod-scoped
            # copilot-home emptyDir, so it is always absent at a fresh/cold start.
            - name: WORKER_READY_FILE
              value: "/home/node/.copilot/worker.ready"
            # PluginSpec: ;-delimited external plugin repos (ADO/GitHub) the
            # worker downloads at startup and appends to its plugin dirs, so the
            # GHCP SDK loads their agents + skills (e.g. "show me all skills"
            # surfaces them). URL-free here: the concrete value names an ADO
            # org/project/repo and is substituted per-repo by the deploy scripts
            # from values/<repo>.env. Empty string = no external plugins. Private
            # ADO clones authenticate with a Code:Read PAT the worker reads from
            # Key Vault via its managed identity (ADO_PAT_KEYVAULT_SECRET_URI
            # below) — no PAT is stored in a Secret. The worker also accepts a
            # direct ADO_PAT env, and the literal env name PluginSpec as an alias.
            - name: PLUGIN_SPEC
              value: "__PLUGIN_SPEC__"
            # Key Vault secret URI for the ADO Code:Read PAT used by PluginSpec
            # ADO clones (https://<vault>.vault.azure.net/secrets/<name>). The
            # worker's managed identity reads it directly — no PAT lands in a
            # k8s Secret. Empty when the repo has no private-ADO plugin sources.
            - name: ADO_PAT_KEYVAULT_SECRET_URI
              value: "__ADO_PAT_KV_SECRET_URI__"
            # Delegated MCP (repo-stored config): the MCP servers this repo
            # declares in its own .vscode/mcp.json are loaded at startup and
            # granted to every session on this repo-pinned fleet (URL-free — the
            # list comes from the enlistment itself, not from here). REPO_MCP_ALLOW
            # curates which server ids load (comma-delimited; empty = all remote
            # servers). Loading is on by default; set REPO_MCP_ENABLED=0 to disable.
            - name: REPO_MCP_ALLOW
              value: "__REPO_MCP_ALLOW__"
            # Fleet-default MCP servers (feature: default MCP servers not checked
            # into the repo, e.g. ADO): an inline JSONC { "servers": { ... } } map
            # of REMOTE servers injected into EVERY session regardless of the
            # target repo's .vscode/mcp.json. Each is treated as OPTIONAL -- a
            # session whose caller has no token for the server's audience silently
            # runs without it (no fast-fail). URL-free rule: the concrete ADO
            # URL/org live ONLY in the ADO-side deploy value, never in this base
            # manifest. Empty = no fleet defaults. A repo that declares its own
            # server of the same name overrides the default deterministically.
            - name: DEFAULT_MCP_JSON
              value: "__DEFAULT_MCP_JSON__"
            # Delegated caller auth: Key Vault name where the portal persists a
            # caller's delegated bearer at createSession (secret name derived from
            # the session id: ps-caller-<sessionId>). The worker reads it via its
            # managed identity and injects Authorization: Bearer into repo-declared
            # remote MCP servers that lack an explicit auth header — i.e. connects
            # to those servers "as the caller". Resolved fresh per turn (never in
            # the durable payload). Empty = delegated caller auth off.
            - name: CALLER_AUTH_KEYVAULT_NAME
              value: "__CALLER_AUTH_KEYVAULT_NAME__"
            # NOTE: the worker runs as non-root and reads a root-owned read-only
            # mirror, so git needs safe.directory set. That is baked into the
            # image's SYSTEM git config (deploy/Dockerfile.worker) — git ignores
            # safe.directory from -c / GIT_CONFIG_* env, so it CANNOT be set here.
          envFrom:
            - configMapRef:
                name: worker-env
            - secretRef:
                name: copilot-worker-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "1Gi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          readinessProbe:
            # Truthful readiness: the worker writes this sentinel only AFTER
            # worker.start() resolves — enlistment cloned/synced AND polling PG
            # for jobs (see git-repo-worker.js markReady) — and removes it on
            # drain. So "Ready" means "can accept a job", NOT merely "the mirror
            # exists": a worker doing its one-time cold enlistment clone honestly
            # reports NotReady, and a RollingUpdate won't count more than
            # maxUnavailable pods down at once — nor advance a given pod's slot
            # until this worker can truly serve. The initContainer
            # (wait-for-mirror) still gates process start on the mirror sentinel.
            exec:
              command: ["sh", "-c", "test -f /home/node/.copilot/worker.ready"]
            initialDelaySeconds: 5
            periodSeconds: 15
            failureThreshold: 1000
          volumeMounts:
            - name: copilot-home
              mountPath: /home/node/.copilot
            - name: enlistment
              mountPath: /mnt/enlistment
            - name: model-providers
              mountPath: /app/config
              readOnly: true
            # Node-local mirror, READ-ONLY: the worker clones its enlistment from
            # it once and `git fetch`es from it before each job; only the git-cache
            # daemon writes. Objects are copied into the enlistment (--no-hardlinks),
            # so an active job never depends on the mirror mid-fetch.
            - name: git-cache
              mountPath: /mnt/git-cache
              readOnly: true
      volumes:
        - name: copilot-home
          emptyDir: {}
        # Reused working enlistment. Node-local hostPath on the SAME disk as the
        # mirror (__CACHE_HOSTPATH__ + "-enlistment" sibling), so it survives pod
        # restarts and node reboots: a restarted worker skips the one-time
        # ~minutes clone and just fetch+reset-reconciles from the mirror (seconds).
        # A torn tree (pod killed mid-clone) is self-healed by git-repo-worker.js
        # (health check + reconcile-fallback re-clone). DaemonSet => one worker
        # per node and the pool is pinned to one repo, so this path is never
        # shared. It holds a full working tree (~repo size): the disk backing
        # __CACHE_HOSTPATH__ (the OS disk by default) must fit mirror +
        # enlistment; size the pool's OS disk accordingly for big repos.
        - name: enlistment
          hostPath:
            path: __CACHE_HOSTPATH__-enlistment
            type: DirectoryOrCreate
        - name: model-providers
          configMap:
            name: copilot-worker-model-providers
            items:
              - key: model_providers.json
                path: model_providers.json
        # Same node-local hostPath the git-cache DaemonSet seeds. Shared at the
        # node level (namespace-independent); the worker mounts it read-only.
        # __CACHE_HOSTPATH__ MUST match the git-cache CACHE_HOSTPATH for this repo
        # (default /var/lib/pilotswarm-git-cache; a pool may override to /mnt).
        - name: git-cache
          hostPath:
            path: __CACHE_HOSTPATH__
            type: DirectoryOrCreate
      restartPolicy: Always
      # Must exceed PILOTSWARM_WORKER_SHUTDOWN_TIMEOUT_MS so graceful drain
      # (lifecycle §3.8) can finish in-flight turns before the pod is killed.
      terminationGracePeriodSeconds: 90
