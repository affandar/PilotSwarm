apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: git-repo-worker-secrets
  labels:
    app.kubernetes.io/name: pilotswarm
    app.kubernetes.io/component: git-repo-worker
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: placeholder
    keyvaultName: placeholder
    tenantId: placeholder
    objects: |
      array:
        - |
          objectName: github-token
          objectType: secret
        - |
          objectName: anthropic-api-key
          objectType: secret
        - |
          objectName: azure-oai-key
          objectType: secret
  secretObjects:
    - secretName: git-repo-worker-secrets
      type: Opaque
      data:
        - objectName: github-token
          key: GITHUB_TOKEN
        - objectName: anthropic-api-key
          key: ANTHROPIC_API_KEY
        - objectName: azure-oai-key
          key: AZURE_OAI_KEY
