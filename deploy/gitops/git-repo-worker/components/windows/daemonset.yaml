apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: git-repo-worker
  labels:
    app.kubernetes.io/name: pilotswarm
    app.kubernetes.io/component: git-repo-worker
    pilotswarm.io/git-cache-repo: placeholder
    kubernetes.io/os: windows
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: pilotswarm
      app.kubernetes.io/component: git-repo-worker
      pilotswarm.io/git-cache-repo: placeholder
      kubernetes.io/os: windows
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: __WORKER_MAX_UNAVAILABLE__
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pilotswarm
        app.kubernetes.io/component: git-repo-worker
        pilotswarm.io/git-cache-repo: placeholder
        kubernetes.io/os: windows
        azure.workload.identity/use: "true"
      annotations:
        pilotswarm.dev/spc-keys-hash: placeholder
    spec:
      serviceAccountName: placeholder
      nodeSelector:
        kubernetes.io/os: windows
        pilotswarm.io/git-cache-repo: placeholder
      tolerations:
        - key: pilotswarm.io/cache-not-ready
          operator: Equal
          value: "true"
          effect: NoSchedule
        - key: os
          operator: Equal
          value: windows
          effect: NoSchedule
        - key: kubernetes.azure.com/scalesetpriority
          operator: Equal
          value: spot
          effect: NoSchedule
      securityContext:
        windowsOptions:
          runAsUserName: "ContainerAdministrator"
      initContainers:
        - name: wait-for-mirror
          image: placeholder
          imagePullPolicy: IfNotPresent
          command:
            - pwsh
            - -NoProfile
            - -Command
            - |
              Write-Host "[wait-for-mirror] waiting for $env:GIT_CACHE_READY_FILE ..."
              $t = 0
              while (-not (Test-Path $env:GIT_CACHE_READY_FILE)) {
                Start-Sleep -Seconds 2
                $t += 2
                if ($t % 30 -eq 0) {
                  Write-Host "[wait-for-mirror] still waiting after ${t}s ..."
                }
              }
              Write-Host "[wait-for-mirror] mirror ready after ${t}s"
          envFrom:
            - configMapRef:
                name: git-repo-worker-env
          volumeMounts:
            - name: git-cache
              mountPath: C:\git-cache
              readOnly: true
      containers:
        - name: git-repo-worker
          image: placeholder
          imagePullPolicy: IfNotPresent
          command: ["node", "packages/sdk/examples/git-repo-worker.js"]
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: RUST_LOG
              value: "info"
            - name: PS_MODEL_PROVIDERS_PATH
              value: "C:\\app\\config\\model_providers.json"
            - name: PILOTSWARM_WORKER_CONCURRENCY
              value: "1"
            - name: PILOTSWARM_WORKER_LOCK_TIMEOUT_MS
              value: "90000"
            - name: PILOTSWARM_PG_CONNECTION_TIMEOUT_MS
              value: "45000"
            - name: DUROXIDE_PG_POOL_MAX
              value: "8"
            - name: DUROXIDE_PG_ACQUIRE_TIMEOUT_MS
              value: "60000"
          envFrom:
            - configMapRef:
                name: git-repo-worker-env
            - secretRef:
                name: git-repo-worker-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "2Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          readinessProbe:
            exec:
              command:
                - pwsh
                - -NoProfile
                - -Command
                - if (Test-Path $env:WORKER_READY_FILE) { exit 0 } else { exit 1 }
            initialDelaySeconds: 5
            periodSeconds: 15
            failureThreshold: 1000
          volumeMounts:
            - name: copilot-home
              mountPath: C:\copilot-home
            - name: enlistment
              mountPath: C:\enlistment
            - name: model-providers
              mountPath: C:\app\config
              readOnly: true
            - name: git-cache
              mountPath: C:\git-cache
              readOnly: true
            - name: secrets-store
              mountPath: C:\secrets-store
              readOnly: true
      volumes:
        - name: copilot-home
          emptyDir: {}
        - name: enlistment
          hostPath:
            path: placeholder
            type: DirectoryOrCreate
        - name: model-providers
          configMap:
            name: git-repo-worker-model-providers
            items:
              - key: model_providers.json
                path: model_providers.json
        - name: git-cache
          hostPath:
            path: placeholder
            type: DirectoryOrCreate
        - name: secrets-store
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: git-repo-worker-secrets
      restartPolicy: Always
      terminationGracePeriodSeconds: 90
