apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pilotswarm

# Local-only topology. The Service remains ClusterIP and the base Ingress is
# deleted, so the portal is reachable only through kubectl port-forward.
resources:
  - ../../base

components:
  - ../../components/tls-akv
  - ../../components/portal-replacements

patches:
  - path: delete-ingress.yaml

configMapGenerator:
  - name: portal-env
    envs:
      - .env
