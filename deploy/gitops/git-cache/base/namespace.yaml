# Shared PilotSwarm namespace. BOTH the git-cache (mirror) and git-repo-worker
# DaemonSets live here; the two components are distinguished by resource name
# (pilotswarm-git-cache-* vs git-repo-worker-*) and the
# app.kubernetes.io/component label — NOT by separate namespaces. This object is
# created by whichever component deploys first (apply-cache.ps1 runs before
# apply-worker.ps1); re-applying it is idempotent.
apiVersion: v1
kind: Namespace
metadata:
  name: pilotswarm
  labels:
    app.kubernetes.io/name: pilotswarm
    app.kubernetes.io/part-of: pilotswarm
