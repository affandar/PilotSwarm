# -----------------------------------------------------------------------------
# PilotSwarm git-cache DaemonSet — node-local bare-mirror maintainer.
# AKS git-hydration data plane, one pod per node (AKS-GIT-HYDRATION.md section 5).
#
# Repository identity and tuning are supplied by the overlay-generated
# git-cache-env ConfigMap and structured Kustomize replacements.
# -----------------------------------------------------------------------------
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: git-cache
  namespace: pilotswarm
  labels:
    app.kubernetes.io/name: pilotswarm
    app.kubernetes.io/component: git-cache
    pilotswarm.io/git-cache-repo: placeholder
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: pilotswarm
      app.kubernetes.io/component: git-cache
      pilotswarm.io/git-cache-repo: placeholder
  # maxUnavailable bounds how many nodes update at once. The only rollout step
  # that touches ADO is a COLD node's initial mirror clone (a warm roll is a
  # no-op — readiness is sentinel-gated before any fetch), so this is in effect
  # "max concurrent cold ADO clones". Token substituted from CACHE_MAX_UNAVAILABLE.
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: __CACHE_MAX_UNAVAILABLE__
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pilotswarm
        app.kubernetes.io/component: git-cache
        pilotswarm.io/git-cache-repo: placeholder
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: pilotswarm-git-cache
      # Only run on this repo's labeled node pool (set at pool provision time).
      nodeSelector:
        pilotswarm.io/git-cache-repo: placeholder
      tolerations:
        # Cache pools retain this NoSchedule taint as an isolation boundary.
        # Cache-aware pods tolerate it; repo workers additionally require the
        # ready label added after the mirror is materialized.
        - key: pilotswarm.io/cache-not-ready
          operator: Equal
          value: "true"
          effect: NoSchedule
        # Also tolerate the common control-plane / spot taints so the mirror
        # can seed on any node in the pool.
        - operator: Exists
          effect: NoSchedule
      securityContext:
        # Root: the daemon writes the node-local hostPath mirror and installs
        # curl/jq for the node self-patch. It is a trusted node-local cache.
        runAsUser: 0
        runAsGroup: 0
      containers:
        - name: git-cache
          image: alpine/git:2.45.2
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/scripts/fetch-loop.sh"]
          envFrom:
            - configMapRef:
                name: git-cache-env
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: ADO_PAT_FILE
              value: /mnt/secrets-store/ado-pat
          volumeMounts:
            - name: git-cache
              mountPath: /mnt/git-cache
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: ado-pat
              mountPath: /mnt/secrets-store
              readOnly: true
          readinessProbe:
            # READY only once the mirror sentinel exists, so downstream tooling
            # (and the node ready-label) reflect a materialized cache.
            exec:
              command: ["/bin/sh", "-c", "test -f /mnt/git-cache/$REPO_NAME.ready"]
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 1000
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1"
              # Peak is a COLD `git clone --mirror` running index-pack, whose memory
              # scales with the repo's object/delta graph — tiny for a small repo, but
              # multiple GB for a large monorepo (which OOM-killed at 1Gi). Sized
              # per-repo via CACHE_MEM_LIMIT in values/<repo>.env (default 1Gi).
              memory: "1Gi"
      volumes:
        - name: ado-pat
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: pilotswarm-git-cache-secrets
        # Node-local mirror store. Survives pod restarts and image redeploys —
        # only a genuinely empty node disk triggers a reseed (section 5). The
        # host path defaults to the managed OS disk (/var/lib), but
        # default, or a pool may override to an ephemeral temp disk (/mnt).
        - name: git-cache
          hostPath:
            path: /var/lib/pilotswarm-git-cache
            type: DirectoryOrCreate
        - name: scripts
          configMap:
            name: pilotswarm-git-cache-scripts
            defaultMode: 0755
