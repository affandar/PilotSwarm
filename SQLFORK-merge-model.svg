<svg xmlns="http://www.w3.org/2000/svg" width="980" height="660" viewBox="0 0 980 660" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="ah-grey" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6b7280"/>
    </marker>
    <marker id="ah-blue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/>
    </marker>
    <marker id="ah-green" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#059669"/>
    </marker>
    <marker id="ah-red" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="660" fill="#ffffff"/>

  <!-- ===================== PANEL 1 ===================== -->
  <text x="24" y="28" font-size="15" font-weight="700" fill="#111827">1 — Steady state (merge): one append-only branch; each upstream crank enters as a merge commit; resolutions persist</text>

  <!-- upstream trunk -->
  <line x1="90" y1="156" x2="922" y2="156" stroke="#6b7280" stroke-width="3" marker-end="url(#ah-grey)"/>
  <g>
    <circle cx="175" cy="156" r="13" fill="#6b7280"/><text x="175" y="160" text-anchor="middle" font-size="10" fill="#fff" font-weight="700">U0</text>
    <circle cx="385" cy="156" r="13" fill="#6b7280"/><text x="385" y="160" text-anchor="middle" font-size="10" fill="#fff" font-weight="700">U1</text>
    <circle cx="595" cy="156" r="13" fill="#6b7280"/><text x="595" y="160" text-anchor="middle" font-size="10" fill="#fff" font-weight="700">U2</text>
    <circle cx="805" cy="156" r="13" fill="#6b7280"/><text x="805" y="160" text-anchor="middle" font-size="10" fill="#fff" font-weight="700">U3</text>
  </g>
  <text x="930" y="160" font-size="10" fill="#6b7280">origin/main →</text>
  <text x="24" y="160" font-size="11" fill="#6b7280">upstream</text>

  <!-- stable branch pill on newest fork tip -->
  <rect x="688" y="198" width="234" height="24" rx="12" fill="#d1fae5" stroke="#059669"/>
  <text x="805" y="214" text-anchor="middle" font-size="9" fill="#065f46" font-weight="700">feature/aks-git-repo-worker (live · append-only)</text>
  <line x1="805" y1="222" x2="805" y2="243" stroke="#9ca3af" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- fork branch (append-only, continuous chain) -->
  <line x1="120" y1="256" x2="922" y2="256" stroke="#059669" stroke-width="3" marker-end="url(#ah-green)"/>
  <text x="24" y="260" font-size="11" fill="#6b7280">fork branch</text>
  <text x="930" y="260" font-size="10" fill="#065f46">HEAD →</text>

  <!-- fork base + merge commits + fork-only work dots -->
  <g>
    <!-- divergence base -->
    <circle cx="175" cy="256" r="12" fill="#fff" stroke="#059669" stroke-width="2"/><text x="175" y="260" text-anchor="middle" font-size="9" fill="#065f46" font-weight="700">B</text>
    <!-- fork-only work commits (blue) -->
    <circle cx="280" cy="256" r="8" fill="#2563eb"/>
    <circle cx="490" cy="256" r="8" fill="#2563eb"/>
    <circle cx="700" cy="256" r="8" fill="#2563eb"/>
    <!-- merge commits (green, larger) aligned below each upstream tip -->
    <circle cx="385" cy="256" r="13" fill="#059669"/><text x="385" y="260" text-anchor="middle" font-size="10" fill="#fff" font-weight="700">M1</text>
    <circle cx="595" cy="256" r="13" fill="#059669"/><text x="595" y="260" text-anchor="middle" font-size="10" fill="#fff" font-weight="700">M2</text>
    <circle cx="805" cy="256" r="13" fill="#059669"/><text x="805" y="260" text-anchor="middle" font-size="10" fill="#fff" font-weight="700">M3</text>
  </g>
  <text x="150" y="284" font-size="9" fill="#065f46">upstream-base</text>
  <text x="280" y="238" text-anchor="middle" font-size="9" fill="#2563eb">fork work</text>

  <!-- merge edges: upstream Un -> merge commit Mn (origin/main into live branch) -->
  <g stroke="#059669" stroke-width="1.5">
    <line x1="385" y1="173" x2="385" y2="243" marker-end="url(#ah-green)"/>
    <line x1="595" y1="173" x2="595" y2="243" marker-end="url(#ah-green)"/>
    <line x1="805" y1="173" x2="805" y2="243" marker-end="url(#ah-green)"/>
  </g>
  <text x="250" y="212" font-size="9" fill="#065f46">merge: origin/main ↓ live branch — Un enters as merge commit Mn (pre-merge tip = HEAD^1)</text>

  <text x="24" y="298" font-size="10" fill="#6b7280">Frozen marker upstream-base (eaabdbf9) sits at the original divergence, kept only as a historical tag; the merge-base advances with each merge.</text>
  <text x="24" y="314" font-size="11" fill="#374151">The branch is one append-only chain (not siblings): nothing is rewritten, no force-push. Each conflict is resolved once, in the merge commit, and never re-presented.</text>

  <line x1="24" y1="336" x2="956" y2="336" stroke="#e5e7eb" stroke-width="1"/>

  <!-- ===================== PANEL 2 ===================== -->
  <text x="24" y="368" font-size="15" font-weight="700" fill="#111827">2 — A theme drains to zero: upstream lands it, the next merge converges, the fork's redundant copy drops, the delta shrinks</text>

  <!-- upstream trunk segment -->
  <line x1="120" y1="440" x2="860" y2="440" stroke="#6b7280" stroke-width="3" marker-end="url(#ah-grey)"/>
  <text x="24" y="444" font-size="11" fill="#6b7280">origin/main</text>
  <circle cx="380" cy="440" r="14" fill="#374151"/><text x="380" y="444" text-anchor="middle" font-size="9" fill="#fff" font-weight="700">T</text>
  <text x="380" y="416" text-anchor="middle" font-size="9" fill="#374151">theme T lands upstream (PR merged)</text>

  <!-- fork branch segment -->
  <line x1="120" y1="548" x2="700" y2="548" stroke="#059669" stroke-width="3" marker-end="url(#ah-green)"/>
  <text x="24" y="552" font-size="11" fill="#6b7280">fork (live)</text>
  <!-- fork's soon-redundant copy of theme T -->
  <circle cx="185" cy="548" r="14" fill="#dc2626"/><text x="185" y="552" text-anchor="middle" font-size="9" fill="#fff" font-weight="700">T*</text>
  <text x="185" y="580" text-anchor="middle" font-size="9" fill="#991b1b">fork's copy of theme T</text>
  <!-- merge commit -->
  <circle cx="560" cy="548" r="14" fill="#059669"/><text x="560" y="552" text-anchor="middle" font-size="10" fill="#fff" font-weight="700">M</text>

  <!-- (1) upstream the theme -->
  <path d="M198,536 C 260,478 320,472 366,452" fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#ah-blue)"/>
  <text x="24" y="492" font-size="10" fill="#1d4ed8">(1) upstream the theme (synthesized diff / cherry-pick from fork)</text>

  <!-- (2) merge origin/main -->
  <path d="M394,452 C 470,483 520,502 548,536" fill="none" stroke="#059669" stroke-width="2" marker-end="url(#ah-green)"/>
  <text x="430" y="492" font-size="10" fill="#065f46">(2) merge origin/main</text>

  <!-- (3) converge note -->
  <rect x="612" y="518" width="236" height="60" rx="6" fill="#ecfdf5" stroke="#059669"/>
  <text x="624" y="536" font-size="10" fill="#065f46" font-weight="700">(3) converge → drop fork's copy</text>
  <text x="624" y="552" font-size="9" fill="#065f46">identical  → auto-resolves, no conflict</text>
  <text x="624" y="565" font-size="9" fill="#065f46">divergent → conflict; take upstream's</text>
  <line x1="574" y1="548" x2="612" y2="548" stroke="#059669" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- delta shrink bars -->
  <rect x="884" y="512" width="18" height="66" fill="#fca5a5"/>
  <text x="893" y="592" text-anchor="middle" font-size="8" fill="#991b1b">before</text>
  <rect x="922" y="554" width="18" height="24" fill="#6ee7b7"/>
  <text x="931" y="592" text-anchor="middle" font-size="8" fill="#065f46">after</text>
  <path d="M905,545 C 916,545 916,545 921,560" fill="none" stroke="#059669" stroke-width="1.5" marker-end="url(#ah-green)"/>
  <text x="912" y="506" text-anchor="middle" font-size="9" fill="#065f46" font-weight="700">delta ↓</text>

  <!-- verification + rollback footnotes -->
  <text x="24" y="640" font-size="10" fill="#374151">Proof of convergence: after the merge, <tspan font-family="Consolas, monospace" fill="#111827">git diff origin/main...HEAD</tspan> must no longer show theme T. If it still does, the merge kept your copy — drop it explicitly.</text>
  <text x="24" y="655" font-size="10" fill="#374151">Rollback: before push → <tspan font-family="Consolas, monospace" fill="#111827">git reset --hard HEAD^1</tspan>   ·   after push → <tspan font-family="Consolas, monospace" fill="#111827">git revert -m 1 &lt;merge&gt;</tspan>   (never force-push).</text>
</svg>
