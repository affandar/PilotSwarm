name: Build Windows Worker

# Additive, isolated prototype (see docs/proposals/windows-worker-packaging.md).
# One windows-latest build resolves the Windows-native worker tree ONCE, then
# packages it two ways:
#   - Tail 1: a zip bundle for the ADO Windows-VM host process (always)
#   - Tail 2: a Windows container image for Windows AKS (opt-in via `build_image`)
# Does not touch the existing Linux publish-npm.yml flow.

on:
  push:                    # auto-run on this prototype branch so we can see output pre-merge
    branches:
      - feature/windows-worker-packaging
  workflow_dispatch:
    inputs:
      build_image:
        description: Also build the Windows container image (Tail 2)
        required: false
        default: false
        type: boolean
  # release:               # enable once validated, to attach the zip as a Release asset
  #   types: [published]

permissions:
  contents: read

env:
  NODE_VERSION: "24"

jobs:
  build-windows-worker:
    name: Build Windows worker (zip + optional image)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # ---- SHARED CORE: the one expensive, platform-sensitive step ----
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install deps (full — dev deps like typescript are needed to build)
        run: npm ci

      - name: Build workspaces (tsc -> dist/)
        run: npm run build

      - name: Prune to production deps
        # Drops dev deps (typescript, etc.) but keeps the prod graph — including
        # the duroxide-windows-x64 optional native prebuild — so the staged
        # node_modules is a runtime tree, matching Dockerfile.worker's --omit=dev.
        run: npm prune --omit=dev

      - name: Stage the runnable worker tree
        shell: pwsh
        run: |
          # Mirrors deploy/Dockerfile.worker's COPY manifest, Windows-native.
          $stage = "stage"
          New-Item -ItemType Directory -Force $stage | Out-Null
          $items = @(
            "node_modules",
            "packages\sdk\dist",
            "packages\sdk\plugins",
            "packages\sdk\examples\worker.js",
            "packages\sdk\examples\worker-smoke.mjs",
            "packages\sdk\api",
            "packages\app\tui\plugins",
            "packages\horizon-store\dist",
            "packages\horizon-store\migrations"
          )
          foreach ($i in $items) {
            $dest = Join-Path $stage $i
            New-Item -ItemType Directory -Force (Split-Path $dest -Parent) | Out-Null
            Copy-Item $i -Destination $dest -Recurse -Force
          }
          if (Test-Path ".model_providers.json") { Copy-Item ".model_providers.json" $stage }
          # Fail loudly if the native addon didn't make it into the stage.
          $addon = Get-ChildItem $stage\node_modules -Recurse -Filter "*.node" |
                   Where-Object { $_.FullName -match "duroxide" } | Select-Object -First 1
          if (-not $addon) { throw "duroxide native .node missing from stage — Windows prebuild not resolved" }
          Write-Host "Staged native addon: $($addon.FullName)"

      # ---- TAIL 1: zip bundle (ADO host process) ----
      - name: Pack zip bundle
        shell: pwsh
        run: |
          $ver = node -p "require('./packages/sdk/package.json').version"
          Compress-Archive -Path stage\* -DestinationPath "pilotswarm-worker-win-x64-$ver.zip" -Force
          Write-Host "zip: pilotswarm-worker-win-x64-$ver.zip"

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: pilotswarm-worker-win-x64
          path: pilotswarm-worker-win-x64-*.zip

      # ---- TAIL 2: Windows container image (Windows AKS) — opt-in ----
      - name: Build Windows container image
        if: ${{ inputs.build_image }}
        run: docker build -f deploy/Dockerfile.worker.windows -t copilot-runtime-worker:win-${{ github.sha }} .
